<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Habil Özdemir Mantık Arşivi</title>
    <!-- Markdown yazılarını şık okutmak için gerekli kütüphaneler -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; line-height: 1.7; background: #1a1a1a; color: #fff; }
        a { color: #66f; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 15px; font-size: 2.2em; color: #f0f0f0; }
        .post-list { list-style: none; padding: 0; }
        .post-item { background: #2a2a2a; padding: 20px; border-radius: 12px; margin-top: 15px; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .post-item:hover { background: #323232; }
        p { color: #aaa; margin: 5px 0 0 0; }
        #reader-view { display: none; background: #1a1a1a; min-height: 100vh; }
        .back-btn { display: inline-block; background: #333; color: #fff; padding: 8px 16px; border-radius: 6px; margin-bottom: 20px; font-weight: normal; font-size: 0.9em; }
        .back-btn:hover { background: #444; }
        /* Markdown İçerik Stilleri */
        #content-area h1, #content-area h2, #content-area h3 { color: #f0f0f0; margin-top: 1.5em; }
        #content-area p { color: #e0e0e0; font-size: 1.05em; line-height: 1.8; }
        #content-area strong { color: #fff; background: rgba(255,255,255,0.05); padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- ANA SAYFA: YAZI LİSTESİ -->
    <div id="main-view">
        <h1>Habil Özdemir'in Mantık ve Felsefe Arşivi</h1>
        <p>Geleceğe kalacak, ömür boyu ücretsiz dijital kütüphane.</p>
        <ul id="list-container" class="post-list">
            <!-- Yazılar buraya GitHub'dan otomatik yüklenecek -->
            <li class="post-item">Yazılar yükleniyor...</li>
        </ul>
    </div>

    <!-- OKUMA MODU: YAZI İÇERİĞİ -->
    <div id="reader-view">
        <a href="#" class="back-btn" onclick="showList()">← Arşive Geri Dön</a>
        <div id="content-area"></div>
    </div>

    <script>
        // 1. GİTHUB'DAKİ TÜM .MD DOSYALARINI OTOMATİK ÇEKEN FONKSİYON
        const repoUser = "habilozdemir";
        const repoName = "mantik.blog";

        async function loadFiles() {
            try {
                const response = await fetch(`https://github.com{repoUser}/${repoName}/contents/`);
                const files = await response.json();
                const listContainer = document.getElementById('list-container');
                listContainer.innerHTML = '';

                // Sitedeki sistem dosyalarını filtrele, sadece yazı olan .md dosyalarını al
                const mdFiles = files.filter(file => file.name.endsWith('.md') && file.name.toLowerCase() !== 'readme.md');

                if (mdFiles.length === 0) {
                    listContainer.innerHTML = '<li class="post-item">Henüz yazı bulunamadı.</li>';
                    return;
                }

                mdFiles.forEach(file => {
                    const cleanName = file.name.replace('.md', '');
                    const li = document.createElement('li');
                    li.className = 'post-item';
                    li.innerHTML = `
                        <a href="#" onclick="readPost('${file.name}'); return false;">${cleanName}</a>
                        <p>Yazıyı şık blog formatında okumak için tıklayın.</p>
                    `;
                    listContainer.appendChild(li);
                });
            } catch (error) {
                document.getElementById('list-container').innerHTML = '<li class="post-item">Yazılar yüklenirken bir hata oluştu.</li>';
            }
        }

        // 2. TIKLANAN YAZIYI GHOST/MEDIUM FORMATINDA EKRANA BASAN FONKSİYON
        async function readPost(fileName) {
            try {
                const response = await fetch(`https://githubusercontent.com{repoUser}/${repoName}/main/${encodeURIComponent(fileName)}`);
                const markdownText = await response.text();
                
                // Markdown sembollerini temiz HTML koduna dönüştür
                document.getElementById('content-area').innerHTML = marked.parse(markdownText);
                
                document.getElementById('main-view').style.display = 'none';
                document.getElementById('reader-view').style.display = 'block';
                window.scrollTo(0, 0);
            } catch (error) {
                alert('Yazı yüklenemedi.');
            }
        }

        function showList() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        // Sayfa açıldığında otomatik olarak tüm arşivi tara ve listele
        loadFiles();
    </script>
</body>
</html>
